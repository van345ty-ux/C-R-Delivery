name: cr-sushi-order-api
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./order-schema.received.fixture.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../supabase/migrations/202609020001_order_idempotency.sql:/docker-entrypoint-initdb.d/02-migration.sql:ro
      - ./order-api.fixture.sql:/docker-entrypoint-initdb.d/03-api.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 15
  rest:
    image: public.ecr.aws/supabase/postgrest:v14.5
    environment:
      PGRST_DB_URI: postgres://authenticator@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: local-only-cr-sushi-orders-jwt-secret-do-not-use-outside-tests
      PGRST_SERVER_PORT: 58087
    depends_on:
      db:
        condition: service_healthy
  runner:
    # Usa somente o executável Node da imagem já disponível, sem iniciar o n8n.
    image: n8nio/n8n:latest
    entrypoint: [node]
    command: [--test, dist/order-api.integration.mjs]
    working_dir: /work
    read_only: true
    network_mode: service:rest
    volumes:
      - ../dist/order-api.integration.mjs:/work/dist/order-api.integration.mjs:ro
    profiles: [test]
networks:
  default:
    internal: true
